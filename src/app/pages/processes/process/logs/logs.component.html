<div fxLayout="column" fxFlexFill>
  <div fxLayout="row" class="app-mb-2">
    <div fxFlex fxLayoutAlign="start center">
      <a matButton="filled" color="primary" [href]="urlOutUrl">
        <mat-icon>download</mat-icon>
        {{ logType === 'out' ?  ('button.downloadStandardOutput' | translate) : ('button.downloadErrorOutput' | translate) }}
      </a>
    </div>
    <div>
      <mat-paginator [length]="resultCount" hidePageSize="true" [pageIndex]="pageIndex" [pageSize]="pageSize" [showFirstLastButtons]="true" (page)="onPageChanged($event)"></mat-paginator>
    </div>
  </div>
  <div class="app-oa-y">
    @for (line of lines; track $index) {
      <div [ngClass]="{ 'app-color-warn': (line.startsWith('SEVERE') || line.startsWith('WARNING'))}">
        @for (segment of renderedLines[$index]; track $index) {
          @if (segment.href) {
            <a [href]="segment.href">{{ segment.text }}</a>
          } @else {
            {{ segment.text }}
          }
        }
      </div>
    }
  </div>
</div>
